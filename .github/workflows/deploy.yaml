name: deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required repository variables
        id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # TODO: rename to GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER once deploy-specific SA is provisioned
          GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          # TODO: rename to GCP_DEPLOY_SERVICE_ACCOUNT once deploy-specific SA is provisioned
          GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT }}
          LEETDAILY_CONTAINER_IMAGE: ${{ vars.LEETDAILY_CONTAINER_IMAGE }}
          LEETDAILY_SERVICE_NAME: ${{ vars.LEETDAILY_SERVICE_NAME }}
        run: |
          missing=""
          for key in \
            GCP_PROJECT_ID \
            GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER \
            GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT \
            LEETDAILY_CONTAINER_IMAGE \
            LEETDAILY_SERVICE_NAME
          do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=deploy skipped::Missing repository variables:$missing"
            exit 0
          fi

          # Validate LEETDAILY_CONTAINER_IMAGE format (must be a valid container registry path)
          if ! echo "$LEETDAILY_CONTAINER_IMAGE" | grep -qE '^[a-zA-Z0-9./_-]+(:[a-zA-Z0-9./_-]+|@sha256:[a-fA-F0-9]+)$'; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=deploy skipped::LEETDAILY_CONTAINER_IMAGE has invalid format: $LEETDAILY_CONTAINER_IMAGE"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  build-image:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      registry: ${{ steps.image.outputs.registry }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Derive image coordinates
        id: image
        env:
          LEETDAILY_CONTAINER_IMAGE: ${{ vars.LEETDAILY_CONTAINER_IMAGE }}
        run: |
          repository="${LEETDAILY_CONTAINER_IMAGE%:*}"
          registry="${repository%%/*}"
          image="${repository}:${GITHUB_SHA}"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}

  # Deploys to Cloud Run Job (not Cloud Run Service)
  update-cloud-run-job:
    needs:
      - preflight
      - build-image
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Update Cloud Run Job image
        env:
          SERVICE_NAME: ${{ vars.LEETDAILY_SERVICE_NAME }}
          IMAGE: ${{ needs.build-image.outputs.image }}
          REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run jobs update "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID"

  deploy-skipped:
    needs: preflight
    if: always() && needs.preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip deploy until bootstrap variables are configured
        run: |
          echo "deploy is skipped until the required repository variables are configured."
          echo "Required: GCP_PROJECT_ID, GCP_TERRAFORM_APPLY_WORKLOAD_IDENTITY_PROVIDER, GCP_TERRAFORM_APPLY_SERVICE_ACCOUNT, LEETDAILY_CONTAINER_IMAGE, LEETDAILY_SERVICE_NAME"
